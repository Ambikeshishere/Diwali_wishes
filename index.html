<style>
/* Layout: full-screen WebGL night scene. Letterbox bars and a title card play over the opening dolly shot,
   then a slim control dock fades in at the bottom. */
:root{
  --night:#07030f; --marigold:#ffb627; --flame:#ff7a1a; --rose:#ff4f7b; --teal:#35d6c4;
  --cream:#ffeccb; --mute:#cdb7d6;
  --panel:rgba(18,7,32,.74); --line:rgba(255,182,39,.38);
  --f-display:'Yatra One','Tiro Devanagari Hindi',Georgia,serif;
  --f-body:'Hind','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  box-sizing:border-box;background-color:var(--night);color:var(--cream);
  font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;
}
button{touch-action:manipulation;font-family:inherit}
#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}

.bar{position:fixed;left:0;right:0;height:12vh;background:#000;z-index:4;pointer-events:none;transition:transform 1.6s cubic-bezier(.65,0,.25,1)}
.bar.top{top:0;transform:translateY(-100%)}
.bar.bot{bottom:0;transform:translateY(100%)}
body.cine .bar.top,body.cine .bar.bot{transform:none}

#flash{position:fixed;inset:0;background:#fff3dc;opacity:0;pointer-events:none;z-index:3;mix-blend-mode:screen}

.title{
  position:fixed;inset:0;z-index:5;pointer-events:none;opacity:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
.eyebrow{margin:0;font-size:.78rem;letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
h1{
  margin:0;font-family:var(--f-display);font-weight:400;text-wrap:balance;
  font-size:clamp(2.6rem,11vw,6.2rem);line-height:1.02;color:var(--cream);
  text-shadow:0 0 30px rgba(255,150,40,.75),0 0 3px rgba(255,210,120,.9);
}
.dev{margin:0;font-family:var(--f-display);font-size:clamp(1.3rem,5vw,2.3rem);color:var(--marigold);text-shadow:0 0 18px rgba(255,150,40,.6)}

.hud{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  padding-top:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,rgba(7,3,15,.82),rgba(7,3,15,0));
  opacity:0;pointer-events:none;transition:opacity 1.2s;
}
.hud.on{opacity:1;pointer-events:auto}
.status{margin:0;font-size:.92rem;font-variant-numeric:tabular-nums;text-align:center;text-shadow:0 1px 8px #000}
.dock{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:1040px}
.hint{margin:0;font-size:.8rem;color:var(--mute);text-align:center;text-shadow:0 1px 8px #000}

.btn{
  display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:0 .95rem;
  font:600 .92rem/1 var(--f-body);color:var(--cream);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;cursor:pointer;
  transition:transform .15s,background .2s,border-color .2s;backdrop-filter:blur(6px);
}
.btn:hover{background:rgba(255,182,39,.22);border-color:var(--marigold)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn svg{width:20px;height:20px;fill:none;stroke:var(--c,currentColor);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn[aria-pressed="true"]{background:rgba(255,182,39,.2);border-color:var(--marigold)}
.btn[aria-pressed="false"]{opacity:.78}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}

.toast{
  position:fixed;z-index:8;left:50%;top:calc(14vh + env(safe-area-inset-top,0px));
  transform:translate(-50%,-10px);opacity:0;pointer-events:none;
  max-width:min(92vw,420px);padding:10px 16px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line);color:var(--cream);font-size:.92rem;text-align:center;
  transition:opacity .3s,transform .3s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.nogl{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:var(--night);font-size:1.05rem}
.nogl[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.bar,.hud,.toast,.btn{transition:none}}
</style>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
function rnd(a,b){return a+Math.random()*(b-a)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function lerp(a,b,u){return a+(b-a)*u}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2}
function noGL(){$('#nogl').hidden=false;}
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
if(typeof THREE==='undefined'||!THREE.EffectComposer||!THREE.UnrealBloomPass||!THREE.ShaderPass){noGL();return;}

/* ================= renderer, camera, post ================= */
var W=window.innerWidth,H=window.innerHeight,PR=Math.min(window.devicePixelRatio||1,1.75);
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:$('#gl'),antialias:true,powerPreference:'high-performance'});}catch(e){noGL();return;}
renderer.setPixelRatio(PR);renderer.setSize(W,H,false);
var scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x1a0b28,.012);
var camera=new THREE.PerspectiveCamera(44,W/H,.1,1000);

var composer=new THREE.EffectComposer(renderer);
if(composer.setPixelRatio)composer.setPixelRatio(PR);
composer.setSize(W,H);
composer.addPass(new THREE.RenderPass(scene,camera));
var bloom=new THREE.UnrealBloomPass(new THREE.Vector2(W,H),.7,.6,.5);
composer.addPass(bloom);
var grade=new THREE.ShaderPass({
  uniforms:{tDiffuse:{value:null},time:{value:0}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:[
    'uniform sampler2D tDiffuse;uniform float time;varying vec2 vUv;',
    'void main(){',
    ' vec2 d=vUv-.5;float r=dot(d,d);',
    ' vec2 off=d*r*.014;',
    ' vec3 c;c.r=texture2D(tDiffuse,vUv+off).r;c.g=texture2D(tDiffuse,vUv).g;c.b=texture2D(tDiffuse,vUv-off).b;',
    ' float l=dot(c,vec3(.299,.587,.114));',
    ' c=mix(c*vec3(.90,.96,1.10),c*vec3(1.10,1.0,.88),smoothstep(.12,.6,l));',
    ' c=pow(c,vec3(.92));',
    ' c*=1.0-smoothstep(.2,.8,r*2.4)*.62;',
    ' float g=fract(sin(dot(vUv+fract(time),vec2(12.9898,78.233)))*43758.5453);',
    ' c+=(g-.5)*.04;',
    ' gl_FragColor=vec4(c,1.0);',
    '}'].join('\n')
});
composer.addPass(grade);

var baseR=27,TAN=Math.tan(camera.fov*Math.PI/360);
var pointMat=null;
function onResize(){
  W=window.innerWidth;H=window.innerHeight;
  renderer.setSize(W,H,false);composer.setSize(W,H);
  camera.aspect=W/H;
  camera.setViewOffset(W,H,0,Math.round(H*.1),W,H);
  baseR=Math.max(27,8.6/(TAN*camera.aspect));
  if(pointMat)pointMat.uniforms.uScale.value=H*PR/(2*TAN);
}
window.addEventListener('resize',onResize);

/* ================= helpers: textures ================= */
function glowTexture(stops){
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
  var gr=g.createRadialGradient(64,64,0,64,64,64);
  stops.forEach(function(s){gr.addColorStop(s[0],s[1]);});
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
var texGlow=glowTexture([[0,'rgba(255,255,255,1)'],[.2,'rgba(255,215,150,.7)'],[.55,'rgba(255,140,50,.18)'],[1,'rgba(255,100,20,0)']]);
var texDot=glowTexture([[0,'rgba(255,255,255,1)'],[.35,'rgba(255,255,255,.85)'],[1,'rgba(255,255,255,0)']]);
var texFlame=(function(){
  var c=document.createElement('canvas');c.width=64;c.height=128;var g=c.getContext('2d');
  var gr=g.createRadialGradient(32,96,2,32,86,60);
  gr.addColorStop(0,'rgba(255,250,215,1)');gr.addColorStop(.35,'rgba(255,190,60,.95)');gr.addColorStop(.75,'rgba(255,100,20,.55)');gr.addColorStop(1,'rgba(255,60,10,0)');
  g.fillStyle=gr;
  g.beginPath();g.moveTo(32,4);g.bezierCurveTo(52,40,56,78,32,112);g.bezierCurveTo(8,78,12,40,32,4);g.fill();
  return new THREE.CanvasTexture(c);
})();

/* ================= lights ================= */
scene.add(new THREE.AmbientLight(0x3a2a66,.6));
scene.add(new THREE.HemisphereLight(0x4a3a8a,0x2a1020,.35));
var rim=new THREE.DirectionalLight(0x6a78d0,.55);rim.position.set(-12,16,-14);scene.add(rim);
var houseGlow=new THREE.PointLight(0xff9a40,.8,30,1.2);houseGlow.position.set(0,2.6,10);scene.add(houseGlow);
var doorLight=new THREE.PointLight(0xffc060,.6,9,1.5);doorLight.position.set(0,2,4.6);scene.add(doorLight);
var flashLights=[0,1].map(function(){var l=new THREE.PointLight(0xffffff,0,90,1);scene.add(l);return l;});
var fxLight=new THREE.PointLight(0xffa040,0,12,1.5);scene.add(fxLight);

/* ================= sky, stars, ground ================= */
var sky=new THREE.Mesh(new THREE.SphereGeometry(500,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(.012,.006,.035);vec3 mid=vec3(.05,.02,.11);vec3 hor=vec3(.30,.09,.20);vec3 fogc=vec3(.102,.043,.157);vec3 c=mix(hor,mid,smoothstep(0.,.25,h));c=mix(c,top,smoothstep(.2,.8,h));c=mix(fogc,c,smoothstep(-.02,.05,h));gl_FragColor=vec4(c,1.0);}'
}));
sky.frustumCulled=false;scene.add(sky);

(function(){
  var n=1600,pos=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var y=rnd(.04,1),a=rnd(0,6.283),r=Math.sqrt(1-y*y),R=470;
    pos[i*3]=Math.cos(a)*r*R;pos[i*3+1]=y*R;pos[i*3+2]=Math.sin(a)*r*R;
  }
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var s=new THREE.Points(g,new THREE.PointsMaterial({color:0xfff1d8,size:1.7,sizeAttenuation:false,transparent:true,opacity:.85,fog:false,depthWrite:false}));
  s.frustumCulled=false;scene.add(s);
})();

var ground=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),new THREE.MeshStandardMaterial({color:0x1b0f22,roughness:.95}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
var slab=new THREE.Mesh(new THREE.BoxGeometry(17,.1,13),new THREE.MeshStandardMaterial({color:0x3a2438,roughness:.6}));
slab.position.set(0,.05,9.2);scene.add(slab);

/* rangoli */
(function(){
  var S=1024,c=document.createElement('canvas');c.width=c.height=S;var g=c.getContext('2d'),m=S/2,i,a;
  function circ(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.283);g.fill();}
  g.strokeStyle='#ffb627';g.lineWidth=7;g.beginPath();g.arc(m,m,m-30,0,6.283);g.stroke();
  for(i=0;i<36;i++){a=i/36*6.283;circ(m+Math.cos(a)*(m-62),m+Math.sin(a)*(m-62),11,i%2?'#ffeccb':'#ffb627');}
  var cols=['#ff4f7b','#35d6c4','#ffb627'];
  for(i=0;i<12;i++){
    g.save();g.translate(m,m);g.rotate(i/12*6.283);g.translate(0,-292);
    g.fillStyle=cols[i%3];g.beginPath();g.ellipse(0,0,50,118,0,0,6.283);g.fill();
    g.fillStyle='#ffeccb';g.beginPath();g.ellipse(0,0,16,52,0,0,6.283);g.fill();
    g.restore();
  }
  for(i=0;i<16;i++){
    g.save();g.translate(m,m);g.rotate(i/16*6.283);g.translate(0,-150);
    g.fillStyle=i%2?'#ff7a1a':'#ffeccb';g.beginPath();g.moveTo(0,-44);g.lineTo(22,0);g.lineTo(0,44);g.lineTo(-22,0);g.fill();
    g.restore();
  }
  circ(m,m,78,'#ffb627');circ(m,m,52,'#ff4f7b');circ(m,m,24,'#ffeccb');
  var tex=new THREE.CanvasTexture(c);
  var p=new THREE.Mesh(new THREE.PlaneGeometry(6.4,6.4),new THREE.MeshStandardMaterial({map:tex,transparent:true,roughness:.9,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.3}));

/* ================= house ================= */
var house=new THREE.Group();scene.add(house);
var mWall=new THREE.MeshStandardMaterial({color:0x8a3a66,roughness:.85});
var mTrim=new THREE.MeshStandardMaterial({color:0xc06a8a,roughness:.7});

box(12.6,.5,6.6,0,.25,0,mDark);
box(12,4.2,6,0,2.1,0,mWall);
box(12.7,.35,6.7,0,4.375,0,mTrim);

[[-.9,-.9],[.9,-.9],[-.9,.9],[.9,.9]].forEach(function(p){

box(2.4,.15,2.4,0,8.875,0,mTrim);
var dome=new THREE.Mesh(new THREE.SphereGeometry(1.15,28,14,0,Math.PI*2,0,Math.PI/2),mGold);

function archGeo(w,h){

  pLife[i]=life;pMax[i]=life;pBase[i]=size;pSize[i]=size;pAlpha[i]=1;pDrag[i]=drag;pGrav[i]=grav;pFlag[i]=flag||0;
}
function crackleAt(x,y,z){for(var i=0;i<7;i++){var d=randUnit();emit(x,y,z,d[0]*4,d[1]*4,d[2]*4,GOLD,.4,.13,2.2,3,0);}}
function updateParticles(dt){
  var i,j,L,k,a;
  for(i=0;i<N;i++){
    L=pLife[i];if(L<=0)continue;
    L-=dt;j=i*3;
    if(L<=0){pLife[i]=0;pAlpha[i]=0;pSize[i]=0;if(pFlag[i]&2)crackleAt(pPos[j],pPos[j+1],pPos[j+2]);continue;}
    pLife[i]=L;
    k=Math.exp(-pDrag[i]*dt);
    pVel[j]*=k;pVel[j+1]=pVel[j+1]*k-pGrav[i]*dt;pVel[j+2]*=k;
    pPos[j]+=pVel[j]*dt;pPos[j+1]+=pVel[j+1]*dt;pPos[j+2]+=pVel[j+2]*dt;
    if(pPos[j+1]<0.05){pLife[i]=0;pAlpha[i]=0;pSize[i]=0;continue;}
    a=L/pMax[i];
    var al=Math.min(1,a*1.8);
    if((pFlag[i]&4)&&Math.random()<.2)al*=.3;
    pAlpha[i]=al;pSize[i]=pBase[i]*(.55+.45*a);
    if((pFlag[i]&1)&&Math.random()<dt*16)emit(pPos[j],pPos[j+1],pPos[j+2],0,0,0,[pCol[j],pCol[j+1],pCol[j+2]],.38,pBase[i]*.7,1,0,0);
  }
  pGeo.attributes.position.needsUpdate=true;pGeo.attributes.aColor.needsUpdate=true;
  pGeo.attributes.aAlpha.needsUpdate=true;pGeo.attributes.aSize.needsUpdate=true;
}
function randUnit(){var z=rnd(-1,1),a=rnd(0,6.2832),r=Math.sqrt(1-z*z);return [r*Math.cos(a),z,r*Math.sin(a)];}

var KINDS=['peony','ring','willow','double','crackle','heart'];
var camX=new THREE.Vector3(),camY=new THREE.Vector3(),camZ=new THREE.Vector3();
function burst(x,y,z,kind,scale,vol){
  scale=scale||1;kind=kind||pick(KINDS);
  var pal=pick(PALS),i,n,d,sp;
  if(kind==='peony'||kind==='crackle'){
    for(i=0;i<150;i++){d=randUnit();sp=rnd(11,22)*scale;emit(x,y,z,d[0]*sp,d[1]*sp,d[2]*sp,pick(pal),rnd(1.5,2.3),.3*scale,2.3,3.5,1|(kind==='crackle'&&i%4===0?2:0));}
  }else if(kind==='ring'){
    camera.matrixWorld.extractBasis(camX,camY,camZ);
    var nrm=[camZ.x*.5+rnd(-.7,.7),rnd(-.3,.9),camZ.z*.5+rnd(-.7,.7)],nl=Math.hypot(nrm[0],nrm[1],nrm[2]);
    nrm=[nrm[0]/nl,nrm[1]/nl,nrm[2]/nl];
    var u=[nrm[1],-nrm[0],0],ul=Math.hypot(u[0],u[1])||1;u=[u[0]/ul,u[1]/ul,0];
    var w=[nrm[1]*u[2]-nrm[2]*u[1],nrm[2]*u[0]-nrm[0]*u[2],nrm[0]*u[1]-nrm[1]*u[0]];
    n=72;
    for(i=0;i<n;i++){var t=i/n*6.2832,cx=Math.cos(t)*17*scale,cy=Math.sin(t)*17*scale;emit(x,y,z,u[0]*cx+w[0]*cy,u[1]*cx+w[1]*cy,u[2]*cx+w[2]*cy,pal[0],1.8,.3*scale,2.1,2.5,1);}
    for(i=0;i<50;i++){d=randUnit();sp=rnd(2,6)*scale;emit(x,y,z,d[0]*sp,d[1]*sp,d[2]*sp,pal[pal.length-1],1.2,.22*scale,2.2,2,0);}
  }else if(kind==='willow'){
    for(i=0;i<110;i++){d=randUnit();sp=rnd(7,17)*scale;emit(x,y,z,d[0]*sp,d[1]*sp,d[2]*sp,GOLD,rnd(2.6,3.6),.26*scale,1.5,4.2,1|4);}
  }else if(kind==='double'){
    for(i=0;i<100;i++){d=randUnit();sp=rnd(14,21)*scale;emit(x,y,z,d[0]*sp,d[1]*sp,d[2]*sp,pal[0],rnd(1.6,2.2),.3*scale,2.3,3.5,1);}
    for(i=0;i<70;i++){d=randUnit();sp=rnd(6,8)*scale;emit(x,y,z,d[0]*sp,d[1]*sp,d[2]*sp,pal[pal.length-1],1.7,.26*scale,2.2,3,0);}
  }else if(kind==='heart'){
    camera.matrixWorld.extractBasis(camX,camY,camZ);
    for(i=0;i<90;i++){
      var tt=i/90*6.2832,hx=16*Math.pow(Math.sin(tt),3),hy=13*Math.cos(tt)-5*Math.cos(2*tt)-2*Math.cos(3*tt)-Math.cos(4*tt);
      var vx=hx/16*17*scale,vy=hy/16*17*scale;
      emit(x,y,z,camX.x*vx+camY.x*vy,camX.y*vx+camY.y*vy,camX.z*vx+camY.z*vy,ROSE,1.9,.32*scale,2.1,1.6,1);
    }
  }
  flashAt(x,y,z,pal[0],2.2*scale);
  var dist=Math.hypot(x-camera.position.x,y-camera.position.y,z-camera.position.z);
  var dl=Math.min(.9,dist/340);
  sfx.boom(vol===undefined?.45:vol,dl);
  if(kind==='crackle'||kind==='willow')sfx.crackle(dl);
}

var gAnar=new THREE.CylinderGeometry(.22,.26,.8,12),gBomb=new THREE.CylinderGeometry(.2,.2,.7,12),gDisc=new THREE.CylinderGeometry(.35,.35,.07,20),gBand=new THREE.CylinderGeometry(.27,.27,.12,12);

function skyPoint(nx,ny){

function updateFx(dt){
  var i,j,n,ang,k;
  for(i=fx.rockets.length-1;i>=0;i--){
    var r=fx.rockets[i];r.t+=dt;
    var u=Math.min(1,r.t/r.T),e=u*(2-u);
    var x=lerp(r.sx,r.tx,e)+Math.sin(u*9)*.25*(1-u),y=lerp(r.sy,r.ty,e),z=lerp(r.sz,r.tz,e);
    n=Math.ceil(dt*140);
    for(j=0;j<n;j++)emit(x,y,z,rnd(-.8,.8),rnd(-1.5,.2),rnd(-.8,.8),pick([GOLD,ORANGE]),rnd(.4,.7),.2,1.2,3,0);
    emit(x,y,z,0,0,0,CREAM,.07,.55,0,0,0);
    if(u>=1){fx.rockets.splice(i,1);burst(r.tx,r.ty,r.tz,r.kind);}
  }
  var lightNeed=0,lc=[1,.6,.2],lpos=null;
  for(i=fx.anars.length-1;i>=0;i--){
    var an=fx.anars[i];an.t+=dt;
    if(an.t<an.T){
      an.acc+=420*dt;
      while(an.acc>=1){
        an.acc-=1;
        var col=an.t>2&&Math.random()<.25?pick([TEAL,ROSE]):pick([GOLD,ORANGE,CREAM]);
        emit(an.x,.85,an.z,rnd(-1.8,1.8),rnd(9,15),rnd(-1.8,1.8),col,rnd(.9,1.6),.17,.35,9,0);
      }
      if(lightNeed<1.8){lightNeed=1.8*(1-an.t/an.T*.4);lpos=[an.x,1.6,an.z];lc=[1,.62,.22];}
    }else if(an.t>an.T+4){scene.remove(an.m);fx.anars.splice(i,1);}
  }
  for(i=fx.chakris.length-1;i>=0;i--){
    var c=fx.chakris[i];c.t+=dt;
    if(c.t<c.T){
      c.spin+=dt*28;c.x+=c.vx*dt;c.z+=c.vz*dt;
      c.x=clamp(c.x,-8,8);c.z=clamp(c.z,2.5,12);
      var cy=.12+Math.abs(Math.sin(c.t*7))*.18;
      c.m.position.set(c.x,cy,c.z);c.m.rotation.y=c.spin;
      c.acc+=380*dt;
      while(c.acc>=1){
        c.acc-=1;
        ang=c.spin+Math.floor(Math.random()*3)*2.094;
        emit(c.x,cy+.1,c.z,Math.cos(ang)*5,rnd(.6,1.6),Math.sin(ang)*5,pick([GOLD,ORANGE,CREAM]),.85,.15,.6,6,0);
      }
      if(lightNeed<1.2){lightNeed=1.2;lpos=[c.x,.9,c.z];lc=[1,.7,.3];}
    }else{
      if(!c.done){c.done=true;for(j=0;j<30;j++){var d=randUnit();emit(c.x,.4,c.z,d[0]*6,Math.abs(d[1])*6,d[2]*6,pick([GOLD,ROSE]),.8,.17,1.5,7,0);}sfx.crackle(0);}
      if(c.t>c.T+3){scene.remove(c.m);fx.chakris.splice(i,1);}
    }
  }
  for(i=fx.bombs.length-1;i>=0;i--){
    var b=fx.bombs[i];b.t+=dt;
    if(!b.boomed){
      emit(b.x+.05,.78,b.z,rnd(-1.5,1.5),rnd(1,3),rnd(-1.5,1.5),pick([GOLD,CREAM,ORANGE]),rnd(.2,.4),.15,1.2,4,0);
      if(b.t>=b.fuse){
        b.boomed=true;scene.remove(b.m);
        flashAmt=1;shake=1;
        flashAt(b.x,6,b.z-14,WHITE,3.2);
        for(j=0;j<280;j++){var d2=randUnit();var s2=rnd(6,26);emit(b.x,.7,b.z,d2[0]*s2,Math.abs(d2[1])*s2*1.1+2,d2[2]*s2,pick([WHITE,ORANGE,GOLD,CREAM]),rnd(.5,1.2),.24,2.4,9,0);}
        var rm=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),new THREE.MeshBasicMaterial({color:0xffe0b0,transparent:true,opacity:.9,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
        rm.rotation.x=-Math.PI/2;rm.position.set(b.x,.2,b.z);scene.add(rm);
        fx.rings.push({m:rm,t:0});
        sfx.boom(1.1,0);
      }
    }else if(b.t>b.fuse+.2){fx.bombs.splice(i,1);}
  }
  for(i=fx.rings.length-1;i>=0;i--){
    var rg=fx.rings[i];rg.t+=dt;
    var s=1+rg.t*26;rg.m.scale.set(s,s,s);rg.m.material.opacity=Math.max(0,.9-rg.t*1.6);
    if(rg.t>.6){scene.remove(rg.m);fx.rings.splice(i,1);}
  }
  if(lpos){fxLight.position.set(lpos[0],lpos[1],lpos[2]);fxLight.color.setRGB(lc[0],lc[1],lc[2]);fxLight.intensity=lightNeed*(.85+.3*Math.random());}

  flashLights.forEach(function(l){var v=l.userData.v||0;v*=Math.exp(-dt*3.6);l.userData.v=v;l.intensity=v<.02?0:v;});
}

var INTRO_DUR=9.5,INTRO_END=10.2,introT=0,introOn=true,introEv=[];
var cam={az:-.85,el:.55,r:60,ty:8.5};

function resetIntro(){
  introT=0;introOn=true;

function updateCamera(dt){
  var g;
  if(introOn){
    introT+=dt;
    var u=ease(Math.min(1,introT/INTRO_DUR));
    g={az:lerp(-.85,0,u),el:lerp(.55,.16,u),r:lerp(baseR*1.9,baseR,u),ty:lerp(8.5,5.2,u)};
    introEv.forEach(function(e){if(!e.d&&introT>=e.t){e.d=true;skyLaunch();}});
    var ti=introT,ta=ti<.8?0:ti<2.2?(ti-.8)/1.4:ti<6.2?1:ti<7.8?1-(ti-6.2)/1.6:0;
    var te=$('#title');te.style.opacity=ta.toFixed(3);te.style.transform='scale('+(1+.04*(1-Math.min(1,ti/6))).toFixed(4)+')';
    if(introT>=INTRO_END)endIntro();
  }else{
    g={az:user.az,el:user.el,r:baseR*user.zoom,ty:5.2};
  }
  var k=1-Math.exp(-dt*(introOn?10:4));
  cam.az+=(g.az-cam.az)*k;cam.el+=(g.el-cam.el)*k;cam.r+=(g.r-cam.r)*k;cam.ty+=(g.ty-cam.ty)*k;
  var ce=Math.cos(cam.el),sw=reduce?0:1;
  camera.position.set(
    Math.sin(cam.az)*ce*cam.r+Math.sin(clock*.37)*.12*sw+(shake>0?rnd(-.35,.35)*shake:0),
    cam.ty+Math.sin(cam.el)*cam.r+Math.sin(clock*.51)*.08*sw+(shake>0?rnd(-.25,.25)*shake:0),
    Math.cos(cam.az)*ce*cam.r
  );
  camera.lookAt(Math.sin(clock*.29)*.1*sw,cam.ty,0);
}

/* ================= main loop ================= */
var tmpC=new THREE.Color(),last=0,ambientT=6,flashEl=$('#flash');
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min(.05,last?(now-last)/1000:.016);last=now;clock+=dt;
  var i;
  updateCamera(dt);
  updateFx(dt);
  updateParticles(dt);

  /* bulbs */
  lightsLvl+=((lightsOn?1:0)-lightsLvl)*(1-Math.exp(-dt*5));
  for(i=0;i<bulbPos.length;i++){
    var f=.06+lightsLvl*(reduce?.9:.55+.45*Math.sin(clock*2.2+bulbPh[i]));
    tmpC.copy(bulbBase[i]).multiplyScalar(f);bulbMesh.setColorAt(i,tmpC);
  }
  bulbMesh.instanceColor.needsUpdate=true;

  /* diyas */
  var n=0;
  for(i=0;i<TOTAL;i++){
    var d=diyas[i];d.level+=((lit[i]?1:0)-d.level)*(1-Math.exp(-dt*5));
    var fl=reduce?1:1+.08*Math.sin(clock*11+d.ph)+.05*Math.sin(clock*17+d.ph*2);
    d.flame.material.opacity=d.level;d.flame.scale.set(.4*d.level*(2-fl),.75*d.level*fl,1);
    d.halo.material.opacity=d.level*.55;d.halo.scale.setScalar(2.4+.2*Math.sin(clock*3+d.ph));
    d.light.intensity=d.level*(1.1+.15*Math.sin(clock*9+d.ph));
    d.oil.material.color.setHex(lit[i]?0xffb627:0x2a1405);
    n+=d.level;
  }
  warm=n/TOTAL;
  houseGlow.intensity=.25+warm*.75;
  bloom.strength=.65+warm*.2;

  /* embers */
  var ep=embers.geometry.attributes.position.array;
  for(i=0;i<emberN;i++){
    ep[i*3+1]+=emberV[i]*dt;ep[i*3]+=Math.sin(clock*.6+i)*.25*dt;
    if(ep[i*3+1]>17){ep[i*3+1]=0;ep[i*3]=rnd(-24,24);ep[i*3+2]=rnd(-8,20);}
  }
  embers.geometry.attributes.position.needsUpdate=true;

  /* ambient far fireworks */
  if(!introOn){ambientT-=dt;if(ambientT<=0){ambientT=rnd(4,9);burst(rnd(-60,60),rnd(22,40),rnd(-60,-38),null,2.2,.12);}}

  /* screen effects */
  if(shake>0)shake=Math.max(0,shake-dt*1.8);
  if(flashAmt>0){flashAmt=Math.max(0,flashAmt-dt*3.2);flashEl.style.opacity=(flashAmt*.3).toFixed(3);}
  grade.uniforms.time.value=clock;
  composer.render();
}

onResize();
resetIntro();
cam.r=baseR*1.9;
requestAnimationFrame(loop);
})();
</script>
